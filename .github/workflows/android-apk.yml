name: Zbuduj APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Zainstaluj Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Wygeneruj projekt Android
        working-directory: mobile
        run: flutter create --platforms=android --project-name sharepoint_monitor --org pl.monitor.sharepoint .
      - name: Pobierz zależności
        working-directory: mobile
        run: flutter pub get
      - name: Sprawdź kod Dart
        working-directory: mobile
        run: |
          rm -f test/widget_test.dart
          flutter analyze
      - name: Zbuduj APK do testów
        working-directory: mobile
        run: flutter build apk --debug
      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: sharepoint-monitor-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
